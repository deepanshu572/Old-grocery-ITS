<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coming Soon</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #ffffff;
            color: #1f1f1f;
        }

        .unavailable_page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            background: #ffffff;
        }

        .unavailable_container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        /* Illustration */
        .illustration_box {
            width: 230px;
            height: 230px;
            margin: 0 auto 30px;
            border-radius: 50%;
            background: #f7f7f7;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .store_icon {
            width: 125px;
            height: 105px;
            background: #e8f7e9;
            border-radius: 12px;
            position: relative;
            border: 2px solid #b7dfb9;
        }

        .store_roof {
            position: absolute;
            top: -25px;
            left: -8px;
            width: 137px;
            height: 35px;
            border-radius: 8px 8px 3px 3px;
            background: #d9f1db;
            border: 2px solid #b7dfb9;
        }

        .store_door {
            position: absolute;
            bottom: 0;
            left: 44px;
            width: 38px;
            height: 58px;
            background: #ffffff;
            border: 2px solid #b7dfb9;
            border-bottom: none;
            border-radius: 6px 6px 0 0;
        }

        .store_window {
            position: absolute;
            top: 20px;
            left: 12px;
            width: 25px;
            height: 25px;
            border-radius: 5px;
            background: #ffffff;
            border: 2px solid #b7dfb9;
        }

        .store_window.right {
            left: auto;
            right: 12px;
        }

        .pin {
            position: absolute;
            right: 25px;
            top: 25px;
            width: 48px;
            height: 48px;
            background: #ff7a00;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(255, 122, 0, 0.2);
        }

        .pin::after {
            content: "";
            width: 15px;
            height: 15px;
            background: #ffffff;
            border-radius: 50%;
        }

        /* Content */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #fff4e9;
            color: #e66d00;
            padding: 7px 13px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .badge_dot {
            width: 7px;
            height: 7px;
            background: #ff7a00;
            border-radius: 50%;
        }

        .title {
            font-size: 32px;
            line-height: 1.15;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.7px;
        }

        .description {
            color: #6b6b6b;
            font-size: 15px;
            line-height: 1.6;
            max-width: 390px;
            margin: 0 auto 22px;
        }

        /* Location */
        .location_card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 15px;
            border: 1px solid #eeeeee;
            border-radius: 12px;
            text-align: left;
            margin-bottom: 18px;
            background: #ffffff;
        }

        .location_icon {
            width: 38px;
            height: 38px;
            flex-shrink: 0;
            border-radius: 50%;
            background: #f4f4f4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .location_content {
            min-width: 0;
            flex: 1;
        }

        .location_label {
            font-size: 11px;
            color: #888;
            margin-bottom: 3px;
        }

        .location_text {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .change_location {
            border: none;
            background: transparent;
            color: #e66d00;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        /* Buttons */
        .button_group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .primary_btn {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 10px;
            background: #ff7a00;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .primary_btn:hover {
            background: #ed7000;
        }

        .secondary_btn {
            width: 100%;
            height: 48px;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            background: #ffffff;
            color: #333333;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .secondary_btn:hover {
            background: #fafafa;
        }



        /* Footer */
        .footer_text {
            margin-top: 25px;
            color: #999;
            font-size: 11px;
        }

        @media (max-width: 480px) {

            .unavailable_page {
                padding: 20px;
            }

            .illustration_box {
                width: 190px;
                height: 190px;
                margin-bottom: 25px;
            }

            .title {
                font-size: 28px;
            }

            .description {
                font-size: 14px;
            }

            .pin {
                right: 15px;
                top: 18px;
                transform: rotate(-45deg) scale(0.85);
            }


        }
    </style>
</head>

<body>

    <main class="unavailable_page">

        <div class="unavailable_container">

            <!-- Illustration -->
            <div class="illustration_box">

                <div class="store_icon">

                    <div class="store_roof"></div>

                    <div class="store_window"></div>

                    <div class="store_window right"></div>

                    <div class="store_door"></div>

                </div>

                <div class="pin"></div>

            </div>


            <!-- Status -->
            <div class="badge">
                <span class="badge_dot"></span>
                Coming Soon
            </div>


            <!-- Heading -->
            <h1 class="title">
                We're not here yet!
            </h1>

            <p class="description">
                Sorry, we haven't reached your area yet.
                We're working hard to bring quick deliveries
                to your neighbourhood soon.
            </p>


            <!-- Current Location -->
            <div class="location_card">

                <div class="location_icon">
                    📍
                </div>

                <div class="location_content">

                    <div class="location_label">
                        Your location
                    </div>

                    <div class="location_text" id="locationText"> </div>

                </div>

                <!-- <button
                    class="change_location"
                    onclick="changeLocation()">
                    Change
                </button> -->

            </div>


            <!-- Buttons -->
            <!-- <div class="button_group">

                <button
                    class="primary_btn"
                    onclick="tryAgain()">
                    Try another location
                </button>

                <button
                    class="secondary_btn"
                    onclick="goHome()">
                    Continue browsing
                </button>

            </div> -->





            <div class="footer_text">
                We're expanding every day 🚀
            </div>

        </div>

    </main>


     <script src="https://code.jquery.com/jquery-4.0.0.js"
        integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
    <script>
        let locationText = localStorage.getItem("currentLocation");
        $("#locationText").text(locationText);
    </script>

</body>

</html>
