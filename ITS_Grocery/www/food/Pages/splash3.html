<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ITS-Food</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../assets/css/style.css" />
  
   
  </head>
  <body>
   
<section class="onboarding">

    <!-- Background Blobs -->
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>

    <!-- Delivery Hero -->
    <div class="delivery_section">

        <!-- Route -->
        <div class="route_line"></div>

        <!-- Location Pins -->
        <div class="location start_pin">
            📍
        </div>

        <div class="location end_pin">
            🏠
        </div>

        <!-- Delivery Boy -->
        <div class="delivery_boy">
            <img src="https://cdn-icons-png.flaticon.com/512/1046/1046784.png" alt="">
        </div>

        <!-- Floating Cards -->

        <div class="delivery_card eta_card">
            🚀 15 Min
        </div>

        <div class="delivery_card rating_card">
            ⭐ 4.9 Rating
        </div>

        <div class="delivery_card offer_card">
            🎁 Free Delivery
        </div>

    </div>

    <!-- Content -->

    <div class="content">

        <span class="tag">
            Fast Delivery
        </span>

        <h1>
            Delivered
            <span>To Your Door</span>
        </h1>

        <p>
            Track your order in real-time and get
            your favorite meals delivered hot and fresh
            in just a few minutes.
        </p>

        <div class="dots">
            <span></span>
            <span></span>
            <span class="active_onboard"></span>
        </div>

        <button class="btn_onboard"  onclick="location.href='home.html'">
            Start Ordering
        </button>

    </div>

</section>
    <script src="../../cordova.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="../assets/js/script.js"></script>
  </body>
</html>
