    <div class="filter_data_tab">
      <div class="filter_tab_box">
        <button type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasFilterOption1"
          aria-controls="offcanvasFilterOption1">
          <i class="bi bi-sliders"></i> Filter <b id="countFilter"></b>
          <i class="bi bi-caret-down-fill"></i>
        </button>
      </div>

    </div>

    <div class="shop_detail_product selectedPrd">
      <div class="header_detail">
        <h4>Looking for “<b id="prdName"></b>”</h4>
        <i class="bi bi-chevron-down"></i>
      </div>
      <div class="resturant_product_wrapper" id="selectedProduct"></div>
    </div>
    <div class="shop_detail_product">
      <div class="header_detail">
        <h4>Recomendation for you</h4>
        <i class="bi bi-chevron-down"></i>
      </div>
      <div class="resturant_product_wrapper" id="resturantProduct"></div>
    </div>
    <div class="footer_popup" id="cartPopup" style="display: none;">
      
      <!-- <div class="footer_pop_tab">
        <div class="footer_left">
          <div class="img_footer_pop_img" id="cartPopupImg">

          <p> <b id="popupCount">1</b> item added <br>

  <!-- filter1 -->
  <div class="offcanvas offcanvas-bottom reuse_modal_box filter_reuse modalResturant" tabindex="-1"
    id="offcanvasFilterOption1" aria-labelledby="offcanvasFilterOption1Label">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="offcanvasBottomAddressLabel">Filter</h5>

      <button type="button" data-bs-dismiss="offcanvas" aria-label="Close">
        <i class="bi bi-x"></i>
      </button>
    </div>
    <div class="offcanvas-body small">
      <div class="content_filter">
        <div class="filter_modal">
          <input type="hidden" id="selectedFoodType" value="veg">
          <input type="hidden" id="selectedSort" value="relevance">
          <!-- Left Menu -->
          <div class="left_wrap">
            <div class="filter_sidebar active_sort" onclick="handleFilter('foodType', this)">
              <div class="line_box"></div>
              <div class="filter_tab">Veg/Non-Veg</div>
            </div>

            <div class="filter_sidebar" onclick="handleFilter('sort', this)">
              <div class="line_box"></div>
              <div class="filter_tab">Sort</div>
            </div>
          </div>

          <!-- Right Content -->
          <div id="rightFilter"></div>
        </div>
      </div>
      <div class="modal_fixed_bottom">
        <button class="active" onclick="clearFilters()">Clear Filter</button>
        <button onclick="handleApplyFilter()">Apply</button>
      </div>
    </div>
  </div>
  <!-- filter2 -->
  <div class="offcanvas offcanvas-bottom" tabindex="-1" id="offcanvasFilterOption2"
    aria-labelledby="offcanvasFilterOption2Label">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="offcanvasFilterOption2Label">
        Offcanvas bottom
      </h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body small">...</div>
  </div>

  <!-- add cart box -->

  <div class="offcanvas offcanvas-bottom modalResturant" tabindex="-1" id="offcanvasProductModal"
    aria-labelledby="offcanvasProductModalLabel">
    <div class="offcanvas-header reuse_header_modal_box">
      <div class="left_modal_head">
        <img id="PrdImage" src="" alt="" />
        <h5 class="offcanvas-title" id="offcanvasProductModalLabel">
          <span id="prdNameModal">Chicken Biryani</span>
        </h5>
      </div>
      <button type="button" class="btn_close_custom" data-bs-dismiss="offcanvas" aria-label="Close">
        <i class="bi bi-x"></i>
      </button>
    </div>
    <div class="offcanvas-body small">
      <div class="modalResturant_tedy_sec">
        <img src="../assets/image/icons/tedy.svg" alt="" />
        <div class="txt_tedy">
          <h5>
            Hi, we’ve preselected some popular choices to help you place the
            order faster!
          </h5>
        </div>
      </div>
      <div class="modal_resturant_select_role">
        <h5>
          Qantity : Select any
          <p id="num">1</p>
        </h5>
        <div class="selection_wrap" id="varientData"></div>
      </div>
      <div class="modal_fixed_bottom" id="btnWrapper">

      </div>
    </div>
  </div>

  <!-- product detail box -->

  <div class="offcanvas offcanvas-bottom product_box prd_box_modal" tabindex="-1" id="offcanvasProductBox"
    aria-labelledby="offcanvasProductBoxLabel">
    <div class="offcanvas-body small" id="ProductData"></div>
  </div>
